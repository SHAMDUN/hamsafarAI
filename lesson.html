<style>
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}

body{
    font-family:'Vazirmatn',Tahoma,Arial,sans-serif;
    background:#071923;
    color:#f5f7f8;
    overflow-x:hidden;
    font-size:16px;
    line-height:1.9;
    -webkit-font-smoothing:antialiased;
    direction:rtl;
}

a{color:inherit;text-decoration:none;}
button{font:inherit;cursor:pointer;border:none;outline:none;}

::selection{background:#22D3EE;color:#071923;}
:focus-visible{outline:2px solid #22D3EE;outline-offset:3px;border-radius:4px;}

::-webkit-scrollbar{width:10px;}
::-webkit-scrollbar-track{background:#071923;}
::-webkit-scrollbar-thumb{background:#1a3a48;border-radius:5px;}
::-webkit-scrollbar-thumb:hover{background:#22D3EE;}

:root{
    --bg:#071923;
    --orange:#F59E0B;
    --cyan:#22D3EE;
    --cream:#FEF3C7;
    --white:#F8FAFC;
    --muted:#91A5B2;
    --muted-2:#61798a;
    --line:rgba(255,255,255,.09);
    --line-2:rgba(255,255,255,.15);
    --glass-bg:rgba(13, 38, 51, 0.35);
    --glass-border:rgba(34, 211, 238, 0.15);
    --glass-blur:blur(16px);
}

.container-wide{
    width:min(1400px, calc(100% - 40px));
    margin:auto;
}

/* =========================================================
   BACKGROUND & NAV (بدون تغییر)
========================================================= */
.background-glow{position:fixed;width:600px;height:600px;border-radius:50%;filter:blur(120px);pointer-events:none;opacity:.08;z-index:0;}
.glow-one{background:var(--cyan);top:-300px;right:-250px;}
.glow-two{background:var(--orange);bottom:-300px;left:-250px;}

#dnaCanvas{position:fixed;inset:0;width:100vw;height:100vh;z-index:1;pointer-events:none;opacity:0.15;filter:blur(1px);}
.bg-overlay{position:fixed;inset:0;background:radial-gradient(circle at 50% 50%, transparent 0%, rgba(7,25,35,0.6) 100%);pointer-events:none;z-index:1;}

.progress-bar{position:fixed;top:0;right:0;height:2px;background:linear-gradient(90deg,var(--orange),var(--cyan));z-index:999;width:0;transition:width .1s linear;box-shadow:0 0 12px rgba(34,211,238,.5);}

header{position:fixed;top:0;left:0;right:0;z-index:100;transition:all .3s;}
header.scrolled{background:rgba(7,25,35,.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--line);}
.navbar{height:86px;display:flex;align-items:center;justify-content:space-between;transition:height .3s;gap:20px;max-width:1400px;margin:0 auto;padding:0 20px;}
header.scrolled .navbar{height:70px;}

.logo{display:flex;align-items:center;gap:11px;direction:ltr;font-size:18px;font-weight:800;flex-shrink:0;}
.logo-mark{position:relative;width:39px;height:39px;border-radius:50%;border:1px solid rgba(255,255,255,.18);background:#061620;flex-shrink:0;}
.logo-mark .dot-one{position:absolute;width:8px;height:8px;border-radius:50%;background:var(--orange);left:8px;bottom:8px;box-shadow:0 0 15px rgba(245,158,11,.65);}
.logo-mark .dot-two{position:absolute;width:8px;height:8px;border-radius:50%;background:var(--cyan);right:8px;top:8px;box-shadow:0 0 15px rgba(34,211,238,.65);}
.logo-mark .path{position:absolute;width:25px;height:17px;border-top:2px solid var(--cream);border-radius:50%;left:7px;top:11px;transform:rotate(-27deg);}

.nav-menu{display:flex;align-items:center;gap:32px;color:#9DAFB9;font-size:13px;}
.nav-menu a{transition:.25s;}
.nav-menu a:hover{color:white;}
.nav-cta{padding:10px 17px;border:1px solid rgba(34,211,238,.3);border-radius:12px;color:var(--cyan);font-size:12px;font-weight:600;transition:.25s;background:rgba(34,211,238,.04);flex-shrink:0;}
.nav-cta:hover{background:rgba(34,211,238,.12);border-color:var(--cyan);}

/* =========================================================
   LAYOUT & CANVAS CONTAINER
========================================================= */
.lesson-layout {
    display: grid;
    grid-template-columns: 1fr 45vw; /* ستون راست متن، ستون چپ برای انیمیشن */
    gap: 40px;
    padding: 120px 0 60px;
    position: relative;
    z-index: 2;
    align-items: start;
}

/* ستون سمت راست (محتوا) */
.lesson-content-col {
    padding-top: 20px;
}

/* ستون سمت چپ (انیمیشن چسبان) */
.visual-col {
    position: sticky;
    top: 100px;
    display: flex;
    justify-content: center;
    align-items: center;
    height: calc(100vh - 120px);
}

/* کانتینر دایره‌ای شکل برای کانواس */
.brain-container {
    width: 45vw;
    height: 45vw;
    max-width: 600px;
    max-height: 600px;
    border-radius: 50%;
    overflow: hidden;
    position: relative;
    background: #02050a;
    border: 2px solid rgba(34, 211, 238, 0.2);
    box-shadow: 0 0 60px rgba(34, 211, 238, 0.1), inset 0 0 40px rgba(0,0,0,0.8);
    /* ایجاد هاله نورانی دور دایره */
    outline: 4px solid rgba(34, 211, 238, 0.05);
    outline-offset: 10px;
}

.brain-container canvas {
    display: block;
    width: 100%;
    height: 100%;
}

/* استایل‌های متون درس */
.lesson-hero-tags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;}
.tag{display:inline-flex;align-items:center;gap:5px;padding:6px 13px;border-radius:10px;font-size:12px;font-weight:700;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);}
.tag-track{background:rgba(34,211,238,.15);color:var(--cyan);border:1px solid rgba(34,211,238,.3);}
.tag-course{background:rgba(245,158,11,.15);color:var(--orange);border:1px solid rgba(245,158,11,.3);}
.tag-time{background:rgba(34,197,94,.15);color:#4ade80;border:1px solid rgba(34,197,94,.3);}

.lesson-hero h1{
    font-size:clamp(28px, 4vw, 42px);
    font-weight:900;
    line-height:1.25;
    letter-spacing:-1.5px;
    margin-bottom:18px;
    background:linear-gradient(135deg, var(--white) 0%, var(--cream) 100%);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    background-clip:text;
}
.lesson-hero .excerpt{color:var(--muted);font-size:16px;line-height:2.05;max-width:100%;margin-bottom:30px;}

/* محتوای Markdown */
.lesson-content{
    background:var(--glass-bg);
    backdrop-filter:var(--glass-blur);
    -webkit-backdrop-filter:var(--glass-blur);
    border:1px solid var(--glass-border);
    border-radius:22px;
    padding:40px;
    color:#cbd5e1;
    font-size:16px;
    line-height:2.1;
    overflow:hidden;
    position:relative;
}
.lesson-content::before{content:"";position:absolute;top:0;right:0;width:100%;height:2px;background:linear-gradient(90deg, transparent, var(--cyan), transparent);}
.lesson-content h1{color:var(--cream);font-size:28px;font-weight:900;margin:0 0 22px;padding-bottom:16px;border-bottom:1px solid var(--line);}
.lesson-content h2{color:var(--cyan);font-size:22px;font-weight:800;margin:32px 0 16px;display:flex;align-items:center;gap:10px;}
.lesson-content h2::before{content:"";width:5px;height:22px;border-radius:3px;background:linear-gradient(180deg, var(--cyan), var(--orange));flex-shrink:0;}
.lesson-content h3{color:var(--white);font-size:18px;font-weight:800;margin:24px 0 12px;}
.lesson-content p{margin-bottom:18px;}
.lesson-content strong{color:var(--cream);}
.lesson-content em{color:var(--cyan);font-style:normal;font-weight:600;}
.lesson-content a{color:var(--cyan);text-decoration:underline;text-underline-offset:3px;transition:.2s;}
.lesson-content a:hover{color:var(--orange);}
.lesson-content ul,.lesson-content ol{margin:16px 0 20px;padding-right:26px;}
.lesson-content li{margin-bottom:10px;}
.lesson-content ul li::marker{color:var(--cyan);}
.lesson-content code{background:rgba(34,211,238,.12);padding:3px 8px;border-radius:6px;color:var(--cyan);font-family:'JetBrains Mono',monospace;font-size:14px;direction:ltr;display:inline-block;}
.lesson-content pre{background:#0a0f14;border:1px solid rgba(34, 211, 238, 0.2);padding:20px;border-radius:12px;overflow-x:auto;margin:20px 0;direction:ltr;text-align:left;}
.lesson-content pre code{background:none;padding:0;color:#cbd5e1;font-size:13px;display:block;white-space:pre;}
.lesson-content blockquote{border-right:4px solid var(--cyan);background:rgba(34,211,238,.05);padding:16px 22px;margin:22px 0;border-radius:0 12px 12px 0;font-style:italic;}
.lesson-content img{max-width:100%;border-radius:14px;margin:20px 0;border:1px solid var(--line);display:block;}
.lesson-content table{width:100%;border-collapse:collapse;margin:22px 0;font-size:14px;}
.lesson-content th,.lesson-content td{border:1px solid var(--line);padding:12px 16px;text-align:right;}
.lesson-content th{background:rgba(34,211,238,.08);color:var(--cyan);font-weight:800;}

/* دکمه‌های ناوبری */
.lesson-nav{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:40px;}
.nav-card{display:flex;align-items:center;gap:16px;padding:18px 20px;background:var(--glass-bg);border:1px solid var(--glass-border);border-radius:16px;transition:.3s;text-decoration:none;color:inherit;}
.nav-card:hover{border-color:rgba(34,211,238,.4);transform:translateY(-3px);box-shadow:0 15px 40px rgba(0,0,0,.4);}
.nav-card.next{flex-direction:row-reverse;}
.nav-card-arrow{font-size:24px;color:var(--cyan);}
.nav-card-info{flex:1;min-width:0;}
.nav-card-label{font-size:11px;color:var(--muted-2);margin-bottom:5px;font-family:'JetBrains Mono',monospace;}
.nav-card.next .nav-card-label{text-align:left;}
.nav-card-title{font-size:14px;font-weight:800;color:var(--white);line-height:1.4;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
.nav-card.disabled{opacity:.35;cursor:not-allowed;pointer-events:none;}

/* ریسپانسیو */
@media(max-width: 1100px) {
    .lesson-layout {
        grid-template-columns: 1fr; /* تک ستونه */
        padding-top: 100px;
    }
    .visual-col {
        position: relative;
        top: 0;
        height: auto;
        order: -1; /* انتقال انیمیشن به بالای متن */
        margin-bottom: 30px;
    }
    .brain-container {
        width: 80vw;
        height: 80vw;
        max-width: 500px;
        max-height: 500px;
    }
}

@media(max-width: 768px){
    body{font-size:15px;}
    .nav-menu{display:none;}
    .navbar{height:70px;padding:0 15px;}
    header.scrolled .navbar{height:60px;}
    .logo{font-size:15px;}
    
    .lesson-content{padding:24px 20px;border-radius:16px;font-size:14.5px;}
    .lesson-content h1{font-size:24px;}
    .lesson-content h2{font-size:19px;}
    .lesson-nav{grid-template-columns:1fr;gap:12px;}
}
</style>
</head>

<script>
/* =========================================================
   CONFIG & SUPABASE
========================================================= */
const SUPABASE_URL = 'https://yakalqyryegakukobtwu.supabase.co';
const SUPABASE_KEY = 'sb_publishable_WXEwSb3Uv3-WuPkOyIjh9Q_qQsQ4TNF';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* =========================================================
   DNA BACKGROUND
========================================================= */
(function(){
    const canvas = document.getElementById('dnaCanvas');
    const ctx = canvas.getContext('2d');
    let W, H, time = 0;
    const HELIX_TURNS = 3, NODES_PER_TURN = 20, RADIUS = 110, VERTICAL_SPACING = 22, ROTATION_SPEED = 0.006;
    const TOTAL_NODES = Math.floor(HELIX_TURNS * NODES_PER_TURN);
    const COLOR_A = { r: 34, g: 211, b: 238 }, COLOR_B = { r: 245, g: 158, b: 11 }, COLOR_LINK = { r: 254, g: 243, b: 199 };

    function resize(){ W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
    function draw(){
        ctx.clearRect(0, 0, W, H); time += ROTATION_SPEED;
        const CX = W / 2, CY = H / 2, totalHeight = TOTAL_NODES * VERTICAL_SPACING, startY = CY - totalHeight / 2;
        const nodesA = [], nodesB = [];
        for(let i = 0; i < TOTAL_NODES; i++){
            const y = startY + i * VERTICAL_SPACING;
            const angle = (i / NODES_PER_TURN) * Math.PI * 2 + time;
            const az = Math.sin(angle), bz = Math.sin(angle + Math.PI);
            const perspectiveA = 1 + az * 0.5, perspectiveB = 1 + bz * 0.5;
            nodesA.push({ x: CX + Math.cos(angle) * RADIUS * perspectiveA, y, z: az, size: (1.5 + (az+1)/2*2.5) * perspectiveA, opacity: 0.25 + (az+1)/2*0.75, color: COLOR_A });
            nodesB.push({ x: CX + Math.cos(angle + Math.PI) * RADIUS * perspectiveB, y, z: bz, size: (1.5 + (bz+1)/2*2.5) * perspectiveB, opacity: 0.25 + (bz+1)/2*0.75, color: COLOR_B });
        }
        for(let i = 0; i < TOTAL_NODES; i++){
            const a = nodesA[i], b = nodesB[i], depth = ((a.z + b.z)/2 + 1)/2;
            ctx.strokeStyle = `rgba(34, 211, 238, ${0.05 + depth * 0.35})`;
            ctx.lineWidth = 0.6 + depth * 1.4; ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
        }
        [nodesA, nodesB].forEach(nodes => {
            for(let i = 0; i < nodes.length - 1; i++){
                const p1 = nodes[i], p2 = nodes[i+1], depth = ((p1.z + p2.z)/2 + 1)/2;
                ctx.strokeStyle = `rgba(${nodes===nodesA?34:245}, ${nodes===nodesA?211:158}, ${nodes===nodesA?238:11}, ${0.08 + depth * 0.5})`;
                ctx.lineWidth = 0.7 + depth * 1.3; ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
            }
        });
        const allNodes = [...nodesA, ...nodesB].sort((a,b) => a.z - b.z);
        allNodes.forEach(n => {
            ctx.fillStyle = `rgba(${n.color.r}, ${n.color.g}, ${n.color.b}, ${n.opacity})`;
            ctx.beginPath(); ctx.arc(n.x, n.y, n.size, 0, Math.PI * 2); ctx.fill();
        });
        requestAnimationFrame(draw);
    }
    window.addEventListener('resize', resize); resize(); draw();
})();

/* =========================================================
   BRAIN CANVAS ANIMATION (LOOP)
========================================================= */
(function() {
    const canvas = document.getElementById('brainCanvas');
    const ctx = canvas.getContext('2d');
    let W, H, CX, CY;

    function resize() {
        // ابعاد کانواس دقیقاً به اندازه کانتینر دایره‌ای
        W = canvas.width = canvas.clientWidth;
        H = canvas.height = canvas.clientHeight;
        CX = W / 2;
        CY = H / 2;
    }
    window.addEventListener('resize', resize);
    
    let phase = 'collecting'; 
    let collectedCount = 0;
    let targetCount = 30; // تعداد کمتر برای دایره کوچکتر
    let time = 0;
    
    let brainRadius = 0;
    let maxBrainRadius = Math.min(W, H) * 0.35; 

    let particles = [];
    let brainNodes = []; 
    let bigBangParticles = [];
    let shakeIntensity = 0;
    let flashAlpha = 0;
    let chargingTimer = 0;
    let bigBangTimer = 0;
    let waitingTimer = 0;

    function initParticles() {
        particles = [];
        collectedCount = 0;
        for (let i = 0; i < targetCount; i++) {
            const angle = Math.random() * Math.PI * 2;
            const dist = Math.max(W, H) * 0.5; // از نزدیک‌تر شروع می‌شوند
            particles.push({
                x: CX + Math.cos(angle) * dist,
                y: CY + Math.sin(angle) * dist,
                targetX: CX,
                targetY: CY,
                color: Math.random() > 0.5 ? '34, 211, 238' : '245, 158, 11',
                speed: Math.random() * 3 + 4,
                size: Math.random() * 1.5 + 0.5,
                active: true
            });
        }
    }

    function initBrain() {
        brainRadius = 0;
        brainNodes = [];
        for(let i=0; i<10; i++) {
            const angle = Math.random() * Math.PI * 2;
            const r = Math.random() * 10; 
            const x = Math.cos(angle) * r * 1.2;
            const y = Math.sin(angle) * r * 0.8;
            
            brainNodes.push({
                x: CX + x, y: CY + y,
                baseX: CX + x, baseY: CY + y,
                phase: Math.random() * Math.PI * 2,
                color: Math.random() > 0.5 ? '34, 211, 238' : '245, 158, 11',
                size: Math.random() * 1.5 + 1
            });
        }
    }

    function growBrain() {
        brainRadius += 12;
        for(let i=0; i<12; i++) {
            const angle = Math.random() * Math.PI * 2;
            const r = Math.random() * brainRadius; 
            const x = Math.cos(angle) * r * 1.2;
            const y = Math.sin(angle) * r * 0.8;
            
            brainNodes.push({
                x: CX + x, y: CY + y,
                baseX: CX + x, baseY: CY + y,
                phase: Math.random() * Math.PI * 2,
                color: Math.random() > 0.5 ? '34, 211, 238' : '245, 158, 11',
                size: Math.random() * 1.5 + 1
            });
        }
    }

    function startCharging() {
        phase = 'charging';
        shakeIntensity = 1;
        flashAlpha = 0;
        chargingTimer = 0;
    }

    function triggerBigBang() {
        phase = 'bigbang';
        flashAlpha = 1;
        bigBangTimer = 0;
        
        brainNodes.forEach(node => {
            const angle = Math.atan2(node.y - CY, node.x - CX);
            const speed = Math.random() * 10 + 5;
            bigBangParticles.push({
                x: node.x, y: node.y,
                vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
                color: node.color, size: node.size
            });
        });
        
        for (let i = 0; i < 200; i++) {
            const angle = Math.random() * Math.PI * 2;
            const dist = Math.random() * brainRadius;
            const speed = Math.random() * 15 + 5;
            const colors = ['34, 211, 238', '245, 158, 11', '255, 255, 255'];
            bigBangParticles.push({
                x: CX + Math.cos(angle) * dist,
                y: CY + Math.sin(angle) * dist,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                color: colors[Math.floor(Math.random() * colors.length)],
                size: Math.random() * 2 + 0.5
            });
        }
        brainNodes = []; 
    }

    function resetCycle() {
        phase = 'collecting';
        shakeIntensity = 1;
        chargingTimer = 0;
        bigBangTimer = 0;
        waitingTimer = 0;
        initParticles();
        initBrain();
    }

    // شروع اولیه
    setTimeout(() => {
        resize();
        resetCycle();
        render();
    }, 100);

    function render() {
        ctx.fillStyle = 'rgba(2, 5, 10, 0.3)';
        ctx.fillRect(0, 0, W, H);
        time += 0.08;

        if (phase === 'charging') {
            ctx.save();
            const dx = (Math.random() - 0.5) * shakeIntensity * 8;
            const dy = (Math.random() - 0.5) * shakeIntensity * 8;
            ctx.translate(dx, dy);
            shakeIntensity += 0.3;
            chargingTimer += 1;
            if (chargingTimer > 25) triggerBigBang();
        }

        if (phase === 'collecting' || phase === 'charging') {
            if (brainNodes.length > 0) {
                const pulse = phase === 'charging' ? 1 + Math.sin(time * 30) * 0.15 : 1 + Math.sin(time * 2) * 0.05;

                // خطوط اتصال
                if (phase === 'collecting') {
                    ctx.lineWidth = 1;
                    for (let i = 0; i < brainNodes.length; i++) {
                        for (let j = i + 1; j < brainNodes.length; j++) {
                            const dx = brainNodes[i].x - brainNodes[j].x;
                            const dy = brainNodes[i].y - brainNodes[j].y;
                            const dist = Math.sqrt(dx*dx + dy*dy);
                            const maxDist = 30 + brainRadius * 0.3; 
                            if (dist < maxDist) {
                                let alpha = (1 - dist/maxDist) * 0.4;
                                ctx.strokeStyle = `rgba(34, 211, 238, ${alpha})`;
                                ctx.beginPath(); ctx.moveTo(brainNodes[i].x, brainNodes[i].y); ctx.lineTo(brainNodes[j].x, brainNodes[j].y); ctx.stroke();
                            }
                        }
                    }
                }

                // نورون‌ها
                brainNodes.forEach(node => {
                    const pulseSize = (node.size + Math.sin(time * 3 + node.phase) * 1) * pulse;
                    node.x = node.baseX + Math.sin(time + node.phase) * 1;
                    node.y = node.baseY + Math.cos(time + node.phase) * 1;
                    ctx.fillStyle = `rgba(${node.color}, 1)`;
                    ctx.shadowBlur = phase === 'charging' ? 20 : 5; 
                    ctx.shadowColor = `rgba(${node.color}, 1)`;
                    ctx.beginPath(); ctx.arc(node.x, node.y, pulseSize, 0, Math.PI*2); ctx.fill();
                    ctx.shadowBlur = 0;
                });
            }

            // ذرات
            if (phase === 'collecting') {
                particles.forEach(p => {
                    if (!p.active) return;
                    const dx = p.targetX - p.x;
                    const dy = p.targetY - p.y;
                    const dist = Math.sqrt(dx*dx + dy*dy);

                    if (dist < 10) {
                        p.active = false;
                        collectedCount++;
                        if (collectedCount >= targetCount) {
                            growBrain();
                            if (brainRadius >= maxBrainRadius) startCharging(); 
                            else initParticles(); 
                        }
                    } else {
                        p.x += (dx / dist) * p.speed;
                        p.y += (dy / dist) * p.speed;
                        ctx.strokeStyle = `rgba(${p.color}, 0.6)`;
                        ctx.lineWidth = p.size;
                        ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - (dx/dist)*15, p.y - (dy/dist)*15); ctx.stroke();
                        ctx.fillStyle = `rgba(${p.color}, 1)`;
                        ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
                    }
                });
            }
            if (phase === 'charging') ctx.restore(); 

        } else if (phase === 'bigbang') {
            bigBangTimer++;
            if (flashAlpha > 0) {
                ctx.fillStyle = `rgba(255, 255, 255, ${flashAlpha})`;
                ctx.fillRect(0, 0, W, H);
                flashAlpha -= 0.05;
            }
            bigBangParticles.forEach(p => {
                p.x += p.vx; p.y += p.vy;
                p.vx *= 0.98; p.vy *= 0.98;
                ctx.strokeStyle = `rgba(${p.color}, 0.8)`;
                ctx.lineWidth = p.size;
                ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx*2, p.y - p.vy*2); ctx.stroke();
                ctx.fillStyle = `rgba(${p.color}, 1)`;
                ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
            });
            // اگر ۱۰۰ فریم گذشت، ریست کن
            if (bigBangTimer > 100) resetCycle();
        }
        requestAnimationFrame(render);
    }
})();

/* =========================================================
   UTILS & LOAD LESSON
========================================================= */
function escapeHtml(text){
    if(text === null || text === undefined) return '';
    const div = document.createElement('div'); div.textContent = String(text);
    return div.innerHTML;
}

async function loadLesson(){
    const container = document.getElementById('lessonContentCol');
    const params = new URLSearchParams(window.location.search);
    const slug = params.get('slug');

    if(!slug){
        container.innerHTML = renderError('درسی انتخاب نشده', 'به صفحه‌ی دوره‌ها برگرد و یه درس انتخاب کن');
        return;
    }

    try{
        const { data: lesson, error } = await sb.from('lessons').select('*').eq('slug', slug).eq('status', 'published').maybeSingle();
        if(error || !lesson){
            container.innerHTML = renderError('درس پیدا نشد', 'شاید این درس حذف شده یا هنوز منتشر نشده');
            return;
        }

        const { data: course } = await sb.from('courses').select('*').eq('id', lesson.course_id).maybeSingle();
        let track = null;
        if(course && course.track_id){
            const { data: t } = await sb.from('tracks').select('*').eq('id', course.track_id).maybeSingle();
            track = t;
        }

        let siblings = [];
        if(course){
            const { data: s } = await sb.from('lessons').select('id, title, slug, order_num').eq('course_id', course.id).eq('status', 'published').order('order_num', { ascending: true });
            siblings = s || [];
        }

        renderLesson(lesson, course, track, siblings, container);

    }catch(e){
        console.error(e);
        container.innerHTML = renderError('خطا در بارگذاری', e.message);
    }
}

function renderLesson(lesson, course, track, siblings, container){
    let contentHtml = '';
    try{
        const rawHtml = marked.parse(lesson.content || '', { breaks: true, gfm: true });
        contentHtml = DOMPurify.sanitize(rawHtml, { ADD_TAGS: ['iframe'], ADD_ATTR: ['src', 'width', 'height', 'frameborder', 'allow', 'allowfullscreen', 'style'] });
    }catch(e){
        contentHtml = '<p>خطا در نمایش محتوا</p>';
    }

    const currentIndex = siblings.findIndex(s => s.id === lesson.id);
    const prevLesson = currentIndex > 0 ? siblings[currentIndex - 1] : null;
    const nextLesson = currentIndex < siblings.length - 1 ? siblings[currentIndex + 1] : null;

    const breadcrumbHTML = `
        <div class="breadcrumb" style="display:flex; gap:8px; font-size:13px; color:var(--muted); margin-bottom:20px; flex-wrap:wrap;">
            <a href="index.html">🏠 خانه</a> <span>›</span>
            <a href="courses.html">📚 دوره‌ها</a>
            ${track ? `<span>›</span> <span>${escapeHtml(track.title)}</span>` : ''}
            ${course ? `<span>›</span> <a href="course.html?slug=${encodeURIComponent(course.slug)}">${escapeHtml(course.title)}</a>` : ''}
        </div>
    `;

    const tagsHTML = `
        <div class="lesson-hero-tags">
            ${track ? `<span class="tag tag-track">${escapeHtml(track.title)}</span>` : ''}
            ${lesson.duration ? `<span class="tag tag-time">⏱ ${escapeHtml(lesson.duration)}</span>` : ''}
        </div>
    `;

    let navHTML = '';
    if(prevLesson || nextLesson){
        navHTML = `
            <div class="lesson-nav">
                ${prevLesson ? `
                    <a href="lesson.html?slug=${encodeURIComponent(prevLesson.slug)}" class="nav-card">
                        <span class="nav-card-arrow">→</span>
                        <div class="nav-card-info">
                            <div class="nav-card-label">PREV</div>
                            <div class="nav-card-title">${escapeHtml(prevLesson.title)}</div>
                        </div>
                    </a>
                ` : `<div class="nav-card disabled"><span class="nav-card-arrow">→</span><div class="nav-card-info"><div class="nav-card-label">PREV</div><div class="nav-card-title">درسی نیست</div></div></div>`}

                ${nextLesson ? `
                    <a href="lesson.html?slug=${encodeURIComponent(nextLesson.slug)}" class="nav-card next">
                        <span class="nav-card-arrow">←</span>
                        <div class="nav-card-info">
                            <div class="nav-card-label" style="text-align:left;">NEXT</div>
                            <div class="nav-card-title">${escapeHtml(nextLesson.title)}</div>
                        </div>
                    </a>
                ` : `<div class="nav-card next disabled"><span class="nav-card-arrow">←</span><div class="nav-card-info"><div class="nav-card-label" style="text-align:left;">NEXT</div><div class="nav-card-title">درسی نیست</div></div></div>`}
            </div>
        `;
    }

    container.innerHTML = `
        <section class="lesson-hero">
            ${breadcrumbHTML}
            ${tagsHTML}
            <h1>${escapeHtml(lesson.title)}</h1>
            ${lesson.excerpt ? `<p class="excerpt">${escapeHtml(lesson.excerpt)}</p>` : ''}
        </section>

        <article class="lesson-content">
            ${contentHtml}
        </article>

        ${navHTML}
    `;
}

function renderError(title, message){
    return `
        <div class="error-page" style="text-align:center; padding:50px 20px;">
            <h3>${escapeHtml(title)}</h3>
            <p>${escapeHtml(message)}</p>
            <a href="courses.html" style="color:var(--cyan); margin-top:20px; display:inline-block;">← بازگشت به دوره‌ها</a>
        </div>
    `;
}

/* Scroll & Progress Bar */
window.addEventListener('scroll', () => {
    const scrollTop = window.scrollY;
    const docHeight = document.documentElement.scrollHeight - window.innerHeight;
    const progress = docHeight > 0 ? (scrollTop / docHeight) * 100 : 0;
    document.getElementById('progressBar').style.width = progress + '%';
    document.getElementById('header').classList.toggle('scrolled', scrollTop > 60);
}, { passive: true });

loadLesson();
</script>
