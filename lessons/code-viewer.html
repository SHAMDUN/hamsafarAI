<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>کد پروژه خلاصه‌ساز | همسفر AI</title>
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
    font-family:'Vazirmatn',Tahoma,sans-serif;
    background:#071923;
    color:#f5f7f8;
    min-height:100vh;
    direction:rtl;
    padding:20px;
}

.code-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:rgba(13, 38, 51, 0.9);
    border:1px solid rgba(34, 211, 238, 0.25);
    border-radius:14px 14px 0 0;
    padding:14px 20px;
    flex-wrap:wrap;
    gap:10px;
}

.code-header-left{
    display:flex;
    align-items:center;
    gap:12px;
}

.code-header .dot{
    width:12px;height:12px;
    border-radius:50%;
}

.dot-red{background:#EF4444;}
.dot-yellow{background:#F59E0B;}
.dot-green{background:#22C55E;}

.code-header .title{
    font-family:monospace;
    font-size:13px;
    color:#22D3EE;
    direction:ltr;
}

.code-actions{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

.action-btn{
    display:inline-flex;
    align-items:center;
    gap:6px;
    padding:8px 14px;
    border:none;
    border-radius:9px;
    font-family:inherit;
    font-size:12px;
    font-weight:700;
    cursor:pointer;
    transition:.2s;
}

.action-btn.copy{
    background:rgba(34, 211, 238, 0.1);
    color:#22D3EE;
    border:1px solid rgba(34, 211, 238, 0.3);
}

.action-btn.copy:hover{
    background:rgba(34, 211, 238, 0.2);
}

.action-btn.run{
    background:linear-gradient(135deg, #F59E0B, #EA580C);
    color:#101820;
    box-shadow:0 6px 20px rgba(245, 158, 11, 0.3);
}

.action-btn.run:hover{
    transform:translateY(-2px);
    box-shadow:0 10px 30px rgba(245, 158, 11, 0.5);
}

.code-body{
    background:#0a0f14;
    border:1px solid rgba(34, 211, 238, 0.25);
    border-top:none;
    border-radius:0 0 14px 14px;
    overflow:hidden;
    position:relative;
}

.code-content{
    max-height:650px;
    overflow-y:auto;
    padding:24px;
    font-family:'JetBrains Mono', 'Courier New', monospace;
    font-size:13px;
    line-height:1.8;
    color:#cbd5e1;
    direction:ltr;
    text-align:left;
    white-space:pre;
    scrollbar-width:thin;
    scrollbar-color:#22D3EE #071923;
    margin:0;
}

.code-content::-webkit-scrollbar{
    width:8px;
}

.code-content::-webkit-scrollbar-track{
    background:#071923;
}

.code-content::-webkit-scrollbar-thumb{
    background:#1a3a48;
    border-radius:4px;
}

.code-content::-webkit-scrollbar-thumb:hover{
    background:#22D3EE;
}

.loading{
    padding:40px;
    text-align:center;
    color:#91A5B2;
    font-family:monospace;
}

.code-footer{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:12px 20px;
    background:rgba(13, 38, 51, 0.6);
    border:1px solid rgba(34, 211, 238, 0.25);
    border-top:none;
    border-radius:0 0 14px 14px;
    font-size:12px;
    color:#61798a;
    font-family:monospace;
    flex-wrap:wrap;
    gap:10px;
    margin-top:-1px;
}

.code-footer .info span{
    color:#22D3EE;
    font-weight:700;
}

@media(max-width:600px){
    body{padding:12px;}
    .code-content{
        padding:16px;
        font-size:11px;
        max-height:450px;
    }
    .action-btn{
        padding:7px 11px;
        font-size:11px;
    }
    .code-header{padding:12px 14px;}
    .code-header .title{font-size:11px;}
}
</style>
</head>
<body>

<div class="code-header">
    <div class="code-header-left">
        <span class="dot dot-red"></span>
        <span class="dot dot-yellow"></span>
        <span class="dot dot-green"></span>
        <span class="title">summarizer.html</span>
    </div>
    <div class="code-actions">
        <button class="action-btn copy" onclick="copyCode()">📋 کپی کد</button>
        <button class="action-btn run" onclick="runCode()">▶️ اجرا کن</button>
    </div>
</div>

<div class="code-body">
    <pre class="code-content" id="codeContent"><div class="loading">⏳ در حال بارگذاری کد...</div></pre>
</div>

<div class="code-footer">
    <div class="info">
        <span id="lineCount">—</span> خط کد · 
        <span id="charCount">—</span> کاراکتر
    </div>
    <div>🎯 پروژه‌ی درس ۶ — همسفر AI</div>
</div>

<script>

/* =========================================================
   LOAD PROJECT CODE
   ========================================================= */
async function loadProjectCode(){
    const codeEl = document.getElementById('codeContent');

    try{
        const response = await fetch('summarizer.html');
        if(!response.ok) throw new Error('فایل پیدا نشد');

        const code = await response.text();

        codeEl.textContent = code;

        // آمار
        const lines = code.split('\n').length;
        const chars = code.length;

        document.getElementById('lineCount').textContent =
            lines.toString().replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
        document.getElementById('charCount').textContent =
            chars.toString().replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);

    }catch(e){
        console.error('Load error:', e);
        codeEl.innerHTML = `<div class="loading" style="color:#F87171;">
            ❌ خطا در بارگذاری کد<br>
            <small>${e.message}</small>
        </div>`;
    }
}

loadProjectCode();


/* =========================================================
   COPY CODE
   ========================================================= */
function copyCode(){
    const codeEl = document.getElementById('codeContent');
    const code = codeEl.textContent;

    navigator.clipboard.writeText(code).then(() => {
        const btn = event.target;
        const original = btn.innerHTML;
        btn.innerHTML = '✓ کپی شد';
        setTimeout(() => btn.innerHTML = original, 2000);
    }).catch(e => {
        alert('خطا در کپی: ' + e.message);
    });
}


/* =========================================================
   RUN CODE
   ========================================================= */
function runCode(){
    window.open('summarizer.html', '_blank');
}

</script>

</body>
</html>
