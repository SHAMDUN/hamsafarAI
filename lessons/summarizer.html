<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>خلاصه‌ساز هوشمند | همسفر AI</title>
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
    font-family:'Vazirmatn',Tahoma,sans-serif;
    background:#071923;
    background-image:
        radial-gradient(circle at 0% 0%, rgba(34,211,238,.06) 0%, transparent 40%),
        radial-gradient(circle at 100% 100%, rgba(245,158,11,.05) 0%, transparent 40%);
    color:#f5f7f8;
    min-height:100vh;
    padding:40px 20px;
    direction:rtl;
    line-height:1.8;
}

.container{
    max-width:820px;
    margin:0 auto;
}

.header{
    text-align:center;
    margin-bottom:36px;
}

.header-icon{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:64px;
    height:64px;
    border-radius:50%;
    background:linear-gradient(135deg, #F59E0B, #22D3EE);
    font-size:32px;
    margin-bottom:16px;
    box-shadow:0 0 40px rgba(245,158,11,.4);
}

h1{
    color:#FEF3C7;
    margin-bottom:8px;
    font-size:30px;
    font-weight:900;
    letter-spacing:-1px;
}

.subtitle{
    color:#91A5B2;
    font-size:14px;
}

.card{
    background:rgba(13, 38, 51, 0.6);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    border:1px solid rgba(34, 211, 238, 0.2);
    border-radius:20px;
    padding:28px;
    margin-bottom:20px;
    position:relative;
    overflow:hidden;
}

.card::before{
    content:"";
    position:absolute;
    top:0;right:0;
    width:100%;
    height:2px;
    background:linear-gradient(90deg, transparent, #22D3EE, transparent);
}

label{
    display:block;
    color:#91A5B2;
    font-size:13px;
    font-weight:700;
    margin-bottom:10px;
    display:flex;
    align-items:center;
    gap:8px;
}

label .badge{
    background:rgba(34,211,238,.1);
    color:#22D3EE;
    font-size:10px;
    padding:2px 8px;
    border-radius:6px;
    font-weight:700;
}

textarea{
    width:100%;
    min-height:220px;
    padding:16px;
    background:rgba(7, 25, 35, 0.8);
    border:1px solid rgba(255, 255, 255, 0.1);
    border-radius:12px;
    color:#f5f7f8;
    font-family:inherit;
    font-size:14px;
    line-height:1.9;
    resize:vertical;
    transition:.25s;
}

textarea:focus{
    outline:none;
    border-color:#22D3EE;
    box-shadow:0 0 0 3px rgba(34, 211, 238, 0.15);
}

textarea::placeholder{
    color:#61798a;
}

.controls{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin:18px 0;
}

select{
    padding:13px 16px;
    background:rgba(7, 25, 35, 0.8);
    border:1px solid rgba(255, 255, 255, 0.1);
    border-radius:10px;
    color:#f5f7f8;
    font-family:inherit;
    font-size:13px;
    cursor:pointer;
    transition:.25s;
}

select:focus{
    outline:none;
    border-color:#22D3EE;
    box-shadow:0 0 0 3px rgba(34, 211, 238, 0.15);
}

.actions{
    display:grid;
    grid-template-columns:2fr 1fr 1fr;
    gap:10px;
}

button{
    padding:15px 20px;
    border:none;
    border-radius:12px;
    font-family:inherit;
    font-size:14px;
    font-weight:800;
    cursor:pointer;
    transition:.25s;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
}

button:disabled{
    opacity:.5;
    cursor:not-allowed;
}

.btn-primary{
    background:linear-gradient(135deg, #F59E0B, #EA580C);
    color:#101820;
    box-shadow:0 8px 25px rgba(245, 158, 11, 0.2);
}

.btn-primary:hover:not(:disabled){
    transform:translateY(-2px);
    box-shadow:0 12px 35px rgba(245, 158, 11, 0.35);
}

.btn-secondary{
    background:rgba(34, 211, 238, 0.08);
    color:#22D3EE;
    border:1px solid rgba(34, 211, 238, 0.3);
}

.btn-secondary:hover:not(:disabled){
    background:rgba(34, 211, 238, 0.18);
    transform:translateY(-2px);
}

.output{
    background:rgba(7, 25, 35, 0.8);
    border:1px solid rgba(34, 211, 238, 0.2);
    border-radius:12px;
    padding:22px;
    min-height:220px;
    color:#cbd5e1;
    font-size:15px;
    line-height:2;
    transition:.3s;
}

.output h1{color:#FEF3C7;font-size:22px;margin:16px 0 10px;padding-bottom:10px;border-bottom:1px solid rgba(255,255,255,.1);}
.output h2{color:#22D3EE;font-size:18px;margin:20px 0 10px;display:flex;align-items:center;gap:8px;}
.output h2::before{content:"";width:4px;height:18px;border-radius:2px;background:linear-gradient(180deg,#22D3EE,#F59E0B);}
.output h3{color:#F8FAFC;font-size:16px;margin:16px 0 8px;}
.output p{margin-bottom:12px;}
.output strong{color:#FEF3C7;font-weight:700;}
.output ul,.output ol{margin:12px 0 12px 0;padding-right:24px;}
.output li{margin-bottom:8px;}
.output li::marker{color:#22D3EE;}
.output code{background:rgba(34,211,238,.1);padding:2px 8px;border-radius:6px;color:#22D3EE;font-family:monospace;font-size:13px;}

.output .placeholder{
    color:#61798a;
    text-align:center;
    padding:70px 20px;
    font-size:14px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:12px;
}

.output .placeholder .icon{
    font-size:42px;
    opacity:.5;
}

.output .error{
    color:#F87171;
    text-align:center;
    padding:40px 20px;
    background:rgba(239, 68, 68, 0.05);
    border-radius:10px;
    border:1px solid rgba(239, 68, 68, 0.2);
}

.output .loading{
    text-align:center;
    padding:50px 20px;
    color:#91A5B2;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:16px;
}

.spinner{
    width:36px;
    height:36px;
    border:3px solid rgba(34, 211, 238, 0.15);
    border-top-color:#22D3EE;
    border-radius:50%;
    animation:spin 1s linear infinite;
}

@keyframes spin{to{transform:rotate(360deg);}}

.stats{
    display:flex;
    flex-wrap:wrap;
    gap:14px;
    justify-content:center;
    margin-top:16px;
    font-size:12px;
    color:#61798a;
    font-family:monospace;
}

.stats span{
    background:rgba(34, 211, 238, 0.05);
    padding:4px 12px;
    border-radius:8px;
    border:1px solid rgba(34, 211, 238, 0.15);
}

.footer{
    text-align:center;
    margin-top:40px;
    color:#61798a;
    font-size:12px;
}

.footer a{
    color:#22D3EE;
    text-decoration:none;
}

@media(max-width:600px){
    body{padding:20px 14px;}
    .card{padding:20px 18px;border-radius:16px;}
    h1{font-size:22px;}
    .controls{grid-template-columns:1fr;}
    .actions{grid-template-columns:1fr;}
    textarea{min-height:160px;font-size:13px;}
    .output{padding:16px;font-size:14px;}
}
</style>
</head>
<body>

<div class="container">

    <div class="header">
        <div class="header-icon">📝</div>
        <h1>خلاصه‌ساز هوشمند</h1>
        <p class="subtitle">متن بلندت رو پیست کن، خلاصه‌ش رو بگیر</p>
    </div>

    <!-- Input Card -->
    <div class="card">
        <label>
            <span>متن ورودی</span>
            <span class="badge" id="inputCount">۰ کاراکتر</span>
        </label>
        <textarea id="inputText" placeholder="متن بلندت رو اینجا پیست کن..."></textarea>

        <div class="controls">
            <select id="summaryLevel">
                <option value="short">✂️ خلاصه‌ی کوتاه (۲ خط)</option>
                <option value="medium" selected>📄 خلاصه‌ی متوسط (۱ پاراگراف)</option>
                <option value="long">📚 خلاصه‌ی کامل (با نکات کلیدی)</option>
            </select>
            <select id="modelSelect">
                <option value="gpt-4o-mini" selected>⚡ GPT-4o Mini (سریع)</option>
                <option value="gpt-4o">💼 GPT-4o (دقیق)</option>
                <option value="claude-3-5-sonnet">🎨 Claude 3.5 Sonnet</option>
                <option value="gemini-1.5-flash">🚀 Gemini 1.5 Flash</option>
            </select>
        </div>

        <div class="actions">
            <button class="btn-primary" id="summarizeBtn" onclick="summarize()">
                ✨ خلاصه کن
            </button>
            <button class="btn-secondary" onclick="pasteExample()">
                📋 نمونه
            </button>
            <button class="btn-secondary" onclick="clearAll()">
                🗑️ پاک
            </button>
        </div>
    </div>

    <!-- Output Card -->
    <div class="card">
        <label>
            <span>خروجی</span>
            <button class="btn-secondary" id="copyBtn" style="display:none;padding:6px 12px;font-size:11px;" onclick="copyResult()">
                📋 کپی
            </button>
        </label>
        <div class="output" id="output">
            <div class="placeholder">
                <span class="icon">👆</span>
                <span>متن رو پیست کن و دکمه‌ی خلاصه رو بزن</span>
            </div>
        </div>
        <div class="stats" id="stats"></div>
    </div>

    <div class="footer">
        ساخته شده با ❤️ برای <a href="https://t.me/hamsafar_ai" target="_blank">همسفر AI</a>
    </div>

</div>

<script>

/* =========================================================
   CONFIG
   ========================================================= */
// ⚠️ این کلید رو با کلید خودت عوض کن
const AVALAI_API_KEY = 'aa-xxxxxxxxxxxxxxxxxxxxxxxx';

const API_URL = 'https://api.avalai.ir/v1/chat/completions';


/* =========================================================
   INPUT COUNTER
   ========================================================= */
document.getElementById('inputText').addEventListener('input', function(){
    const count = this.value.length;
    const faCount = count.toString().replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
    document.getElementById('inputCount').textContent = faCount + ' کاراکتر';
});


/* =========================================================
   SUMMARIZE
   ========================================================= */
async function summarize(){
    const text = document.getElementById('inputText').value.trim();
    const level = document.getElementById('summaryLevel').value;
    const model = document.getElementById('modelSelect').value;

    const btn = document.getElementById('summarizeBtn');
    const output = document.getElementById('output');
    const stats = document.getElementById('stats');
    const copyBtn = document.getElementById('copyBtn');

    // Validation
    if(!text){
        output.innerHTML = '<div class="error">❌ اول یه متن پیست کن</div>';
        return;
    }

    if(text.length < 100){
        output.innerHTML = '<div class="error">❌ متن خیلی کوتاهه (حداقل ۱۰۰ کاراکتر)</div>';
        return;
    }

    if(text.length > 20000){
        output.innerHTML = '<div class="error">❌ متن خیلی بلنده (حداکثر ۲۰۰۰۰ کاراکتر)</div>';
        return;
    }

    // Prompts per level
    const prompts = {
        short: `متن زیر رو در حداکثر ۲ خط خلاصه کن. فقط خلاصه رو بنویس، چیز دیگه اضافه نکن:\n\n${text}`,

        medium: `متن زیر رو در یک پاراگراف (حدود ۵-۷ خط) خلاصه کن. لحن حرفه‌ای و واضح:\n\n${text}`,

        long: `متن زیر رو به این شکل خلاصه کن:

## خلاصه
(یک پاراگراف ۵-۷ خطی)

## نکات کلیدی
- نکته ۱
- نکته ۲
- نکته ۳
- نکته ۴
- نکته ۵

## نتیجه‌گیری
(۲-۳ خط)

متن:
${text}`
    };

    // UI: loading
    btn.disabled = true;
    btn.innerHTML = '<div class="spinner" style="width:16px;height:16px;border-width:2px;"></div> در حال خلاصه کردن...';
    output.innerHTML = '<div class="loading"><div class="spinner"></div>AI داره فکر می‌کنه...</div>';
    stats.innerHTML = '';
    copyBtn.style.display = 'none';

    const startTime = Date.now();

    try{
        const response = await fetch(API_URL, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${AVALAI_API_KEY}`
            },
            body: JSON.stringify({
                model: model,
                messages: [
                    {
                        role: 'system',
                        content: 'تو یه خلاصه‌ساز حرفه‌ای هستی. متن‌ها رو دقیق، واضح و بدون اضافه‌گویی خلاصه می‌کنی. فارسی روان می‌نویسی.'
                    },
                    {
                        role: 'user',
                        content: prompts[level]
                    }
                ],
                temperature: 0.3,
                max_tokens: 2000
            })
        });

        if(!response.ok){
            const errText = await response.text();
            let errMsg = 'خطا در ارتباط با AI';
            try {
                const errJson = JSON.parse(errText);
                errMsg = errJson.error?.message || errMsg;
            } catch(e) {}
            throw new Error(`(${response.status}) ${errMsg}`);
        }

        const data = await response.json();

        if(!data.choices || !data.choices[0] || !data.choices[0].message){
            throw new Error('پاسخ AI ناقصه');
        }

        const result = data.choices[0].message.content;

        // Render markdown
        output.innerHTML = renderMarkdown(result);
        copyBtn.style.display = 'flex';

        // Stats
        const elapsed = ((Date.now() - startTime) / 1000).toFixed(1);
        const inputWords = text.split(/\s+/).filter(w => w).length;
        const outputWords = result.split(/\s+/).filter(w => w).length;
        const compression = Math.round((outputWords / inputWords) * 100);

        stats.innerHTML = `
            <span>⏱ ${elapsed} ثانیه</span>
            <span>📥 ${inputWords} کلمه</span>
            <span>📤 ${outputWords} کلمه</span>
            <span>📊 ${compression}٪</span>
        `;

    }catch(e){
        console.error('Error:', e);
        output.innerHTML = `<div class="error">❌ خطا: ${escapeHtml(e.message)}</div>`;
    }finally{
        btn.disabled = false;
        btn.innerHTML = '✨ خلاصه کن';
    }
}


/* =========================================================
   MARKDOWN RENDERER
   ========================================================= */
function renderMarkdown(text){
    let html = escapeHtml(text);

    // Headings
    html = html.replace(/^### (.*)$/gm, '<h3>$1</h3>');
    html = html.replace(/^## (.*)$/gm, '<h2>$1</h2>');
    html = html.replace(/^# (.*)$/gm, '<h1>$1</h1>');

    // Bold
    html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');

    // Lists
    html = html.replace(/^- (.*)$/gm, '§LI§$1');
    html = html.replace(/(§LI§[^\n]*(\n§LI§[^\n]*)*)/g, function(match){
        const items = match.split('\n').map(l => l.replace('§LI§', '')).filter(l => l);
        return '<ul>' + items.map(i => `<li>${i}</li>`).join('') + '</ul>';
    });

    // Paragraphs
    html = html.replace(/\n\n+/g, '</p><p>');
    html = '<p>' + html + '</p>';
    html = html.replace(/<p><\/p>/g, '');
    html = html.replace(/<p>(<h[123]>)/g, '$1');
    html = html.replace(/(<\/h[123]>)<\/p>/g, '$1');
    html = html.replace(/<p>(<ul>)/g, '$1');
    html = html.replace(/(<\/ul>)<\/p>/g, '$1');

    return html;
}


/* =========================================================
   UTILS
   ========================================================= */
function escapeHtml(text){
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}


/* =========================================================
   ACTIONS
   ========================================================= */
function pasteExample(){
    const example = `هوش مصنوعی شاخه‌ای از علوم کامپیوتر است که به ساخت سیستم‌هایی می‌پردازد که می‌توانند وظایفی را انجام دهند که معمولاً نیاز به هوش انسانی دارند. این فناوری در دهه‌های اخیر پیشرفت چشمگیری داشته و امروزه در بسیاری از جنبه‌های زندگی روزمره ما حضور دارد.

از دستیارهای صوتی مانند سیری و الکسا گرفته تا سیستم‌های توصیه‌گر در نتفلیکس و اسپاتیفای، همه از هوش مصنوعی استفاده می‌کنند. در حوزه پزشکی، هوش مصنوعی به تشخیص بیماری‌ها کمک می‌کند و در خودروسازی، ماشین‌های خودران را ممکن ساخته است.

با این حال، این فناوری چالش‌هایی نیز به همراه دارد، از جمله نگرانی‌های مربوط به حریم خصوصی، سوگیری در الگوریتم‌ها، و تأثیر آن بر بازار کار. بسیاری از کارشناسان معتقدند که باید آموزش هوش مصنوعی را در سطح عمومی گسترش داد تا افراد بتوانند با این فناوری به شکل آگاهانه و مسئولانه برخورد کنند.`;

    document.getElementById('inputText').value = example;
    document.getElementById('inputText').dispatchEvent(new Event('input'));
}

function clearAll(){
    document.getElementById('inputText').value = '';
    document.getElementById('inputCount').textContent = '۰ کاراکتر';
    document.getElementById('output').innerHTML = `
        <div class="placeholder">
            <span class="icon">👆</span>
            <span>متن رو پیست کن و دکمه‌ی خلاصه رو بزن</span>
        </div>
    `;
    document.getElementById('stats').innerHTML = '';
    document.getElementById('copyBtn').style.display = 'none';
}

function copyResult(){
    const output = document.getElementById('output');
    const text = output.textContent;

    navigator.clipboard.writeText(text).then(() => {
        const btn = document.getElementById('copyBtn');
        const original = btn.textContent;
        btn.textContent = '✓ کپی شد';
        setTimeout(() => btn.textContent = original, 2000);
    }).catch(e => {
        alert('خطا در کپی');
    });
}

</script>

</body>
</html>
